name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # I pin the same Flutter minor version I build the app with.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Plain flutter test only runs test/, so the on-device integration tests are skipped.
      - run: flutter test

  training:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements-ci.txt
      # I install only what the tests import, not the full GPU training stack.
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest -v
